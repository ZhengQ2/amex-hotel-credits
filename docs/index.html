<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
  <title>Amex Credit Map — Hilton · FHR · THC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f1f5f9; }
    #header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(15, 23, 42, .96); backdrop-filter: blur(10px); border-bottom: 1px solid #1e293b; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    #header h1 { font-size: .95rem; font-weight: 700; white-space: nowrap; color: #f8fafc; }
    #search { flex: 1; min-width: 160px; max-width: 280px; background: #1e293b; border: 1px solid #334155; color: #f1f5f9; padding: 6px 12px; border-radius: 6px; font-size: .82rem; }
    #search::placeholder { color: #64748b; } #search:focus { outline: none; border-color: #60a5fa; }
    #legend { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .leg { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; border: 1.5px solid transparent; cursor: pointer; font-size: .78rem; font-weight: 600; transition: opacity .15s; white-space: nowrap; user-select: none; }
    .leg.off { opacity: .35; } .leg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    #tally { font-size: .75rem; color: #94a3b8; margin-left: auto; white-space: nowrap; }
    #map { position: fixed; top: 49px; left: 0; width: 100%; height: calc(100vh - 49px); }
    .hp { min-width: 210px; max-width: 300px; padding: 2px; }
    .hp-name { font-size: .88rem; font-weight: 700; color: #0f172a; line-height: 1.35; margin-bottom: 7px; }
    .hp-badge { display: inline-block; padding: 2px 9px; border-radius: 12px; font-size: .68rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .hp-brand { font-size: .76rem; color: #475569; margin-bottom: 3px; } .hp-addr { font-size: .76rem; color: #64748b; margin-bottom: 9px; }
    .hp-link { display: inline-block; padding: 5px 13px; background: #2563eb; color: #fff; border-radius: 5px; font-size: .76rem; font-weight: 600; text-decoration: none; }
    .hp-link:hover { background: #1d4ed8; }
    .hp-list { max-height: 320px; overflow-y: auto; } .hp-list .hp + .hp { border-top: 1px solid #e2e8f0; margin-top: 9px; padding-top: 9px; }
    #tip { position: fixed; z-index: 1001; display: none; pointer-events: none; background: rgba(15, 23, 42, .92); color: #f8fafc; font-size: .74rem; font-weight: 600; padding: 4px 8px; border-radius: 5px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
  </style>
</head>
<body>
<div id="header">
  <h1>🏨 Luxury Hotel Map</h1>
  <input id="search" type="search" placeholder="Search hotels, cities, brands…" autocomplete="off">
  <div id="legend">
    <div class="leg" data-key="Hilton Portfolio" style="border-color:#3b82f6; background:rgba(59,130,246,.1)"><div class="leg-dot" style="background:#3b82f6"></div>Hilton&nbsp;<span id="cnt-hilton" style="font-weight:400;color:#94a3b8"></span></div>
    <div class="leg" data-key="Fine Hotels + Resorts" style="border-color:#f59e0b; background:rgba(245,158,11,.1)"><div class="leg-dot" style="background:#f59e0b"></div>FHR&nbsp;<span id="cnt-fhr" style="font-weight:400;color:#94a3b8"></span></div>
    <div class="leg" data-key="The Hotel Collection" style="border-color:#22c55e; background:rgba(34,197,94,.1)"><div class="leg-dot" style="background:#22c55e"></div>THC&nbsp;<span id="cnt-thc" style="font-weight:400;color:#94a3b8"></span></div>
  </div>
  <div id="tally">Loading map…</div>
</div>
<div id="map"></div>
<div id="tip"></div>

<script src="map-config.js?v=secure-1"></script>
<script src="https://unpkg.com/supercluster@8.0.1/dist/supercluster.min.js"></script>
<script>
const PROGRAMS = {
  "Hilton Portfolio": { color: "#3b82f6", badgeBg: "#1d4ed8" },
  "Fine Hotels + Resorts": { color: "#f59e0b", badgeBg: "#92400e" },
  "The Hotel Collection": { color: "#22c55e", badgeBg: "#166534" },
};
const CNT_EL = {
  "Hilton Portfolio": document.getElementById("cnt-hilton"),
  "Fine Hotels + Resorts": document.getElementById("cnt-fhr"),
  "The Hotel Collection": document.getElementById("cnt-thc"),
};
const CLUSTER_MAX_ZOOM = 16;  // above this zoom every hotel is drawn on its own
const tally = document.getElementById("tally");
const tip = document.getElementById("tip");
const enabled = Object.fromEntries(Object.keys(PROGRAMS).map(program => [program, true]));
const indexes = {};  // program -> Supercluster over the current (search-filtered) hotels
const counts = {};   // program -> hotels in the current filter
let items = [];      // clusters and single hotels at itemsZoom, all programs, drawn in this order
let itemsZoom = null;
let drawn = [];      // screen-space hit targets from the last draw, topmost last
let map, infoWindow, overlay, frame = 0, cursorIsPointer = false;
let allHotels = [];

function esc(value) {
  return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function popupHtml(hotel) {
  const program = PROGRAMS[hotel.p] || { badgeBg: "#334155" };
  const brand = hotel.b && hotel.b !== hotel.g ? `<div class="hp-brand">${esc(hotel.b)}</div>` : "";
  const address = hotel.a ? `<div class="hp-addr">📍 ${esc(hotel.a)}</div>` : "";
  const link = hotel.u ? `<a class="hp-link" href="${esc(hotel.u)}" target="_blank" rel="noopener noreferrer">View Property →</a>` : "";
  return `<div class="hp"><div class="hp-name">${esc(hotel.n)}</div><span class="hp-badge" style="background:${program.badgeBg}">${esc(hotel.p)}</span>${brand}${address}${link}</div>`;
}

function updateTally() {
  const count = Object.keys(PROGRAMS).filter(program => enabled[program])
    .reduce((total, program) => total + (counts[program] || 0), 0);
  tally.textContent = `${count.toLocaleString()} hotels`;
}

// Web Mercator world coordinates in [0, 1), matching Google's projection.
const worldX = lon => (lon + 180) / 360;
function worldY(lat) {
  const sin = Math.sin(Math.max(-85.05112878, Math.min(85.05112878, lat)) * Math.PI / 180);
  return 0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI);
}
const radiusFor = count => count === 1 ? 6 : 11 + Math.min(10, Math.log10(count) * 5);

function buildIndexes(hotels) {
  const features = Object.fromEntries(Object.keys(PROGRAMS).map(program => [program, []]));
  hotels.forEach(hotel => {
    if (!features[hotel.p] || !Number.isFinite(hotel.lat) || !Number.isFinite(hotel.lon)) return;
    features[hotel.p].push({ type: "Feature", geometry: { type: "Point", coordinates: [hotel.lon, hotel.lat] }, properties: { hotel } });
  });
  Object.keys(PROGRAMS).forEach(program => {
    indexes[program] = new Supercluster({ radius: 60, maxZoom: CLUSTER_MAX_ZOOM }).load(features[program]);
    counts[program] = features[program].length;
    CNT_EL[program].textContent = `(${counts[program].toLocaleString()})`;
  });
  itemsZoom = null;
  updateTally();
  drawPoints();
}

// Clusters are recomputed only when the zoom level or the search filter changes, never while panning.
function computeItems(zoom) {
  items = [];
  Object.keys(PROGRAMS).forEach(program => {
    if (!indexes[program]) return;
    indexes[program].getClusters([-180, -90, 180, 90], zoom).forEach(feature => {
      const [lon, lat] = feature.geometry.coordinates;
      const isCluster = !!feature.properties.cluster;
      const count = isCluster ? feature.properties.point_count : 1;
      items.push({
        program, color: PROGRAMS[program].color, count, lat, lon, wx: worldX(lon), wy: worldY(lat), r: radiusFor(count),
        clusterId: isCluster ? feature.properties.cluster_id : null, hotel: isCluster ? null : feature.properties.hotel,
      });
    });
  });
  items.sort((a, b) => a.count - b.count);  // bigger clusters on top
  itemsZoom = zoom;
}

// Everything is painted onto one canvas: far cheaper than thousands of DOM markers, and no deprecated google.maps.Marker.
function drawPoints() {
  const projection = overlay && overlay.getProjection();
  const canvas = overlay && overlay.canvas;
  const center = map && map.getCenter();
  if (!projection || !canvas || !center) return;
  const zoom = map.getZoom();
  if (Math.round(zoom) !== itemsZoom) computeItems(Math.round(zoom));

  const div = map.getDiv();
  const width = div.clientWidth, height = div.clientHeight, dpr = window.devicePixelRatio || 1;
  const origin = projection.fromLatLngToDivPixel(center);
  canvas.style.left = `${origin.x - width / 2}px`;
  canvas.style.top = `${origin.y - height / 2}px`;
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  if (canvas.width !== Math.round(width * dpr) || canvas.height !== Math.round(height * dpr)) {
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  ctx.font = '700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const scale = 256 * 2 ** zoom;  // world width in pixels
  const left = worldX(center.lng()) * scale - width / 2;
  const top = worldY(center.lat()) * scale - height / 2;
  drawn = [];
  for (const item of items) {
    if (!enabled[item.program]) continue;
    const y = item.wy * scale - top;
    if (y < -item.r || y > height + item.r) continue;
    const base = item.wx * scale - left;
    // Draw every visible copy of the world (several fit across a wide screen at low zoom).
    for (let x = base + Math.ceil((-item.r - base) / scale) * scale; x <= width + item.r; x += scale) {
      ctx.beginPath();
      ctx.arc(x, y, item.r, 0, 2 * Math.PI);
      ctx.globalAlpha = item.count === 1 ? 1 : .85;
      ctx.fillStyle = item.color;
      ctx.fill();
      ctx.globalAlpha = .9;
      ctx.lineWidth = item.count === 1 ? 1.5 : 2;
      ctx.strokeStyle = "#fff";
      ctx.stroke();
      ctx.globalAlpha = 1;
      if (item.count > 1) { ctx.fillStyle = "#fff"; ctx.fillText(String(item.count), x, y + .5); }
      drawn.push({ item, x, y });
    }
  }
}

function scheduleDraw() {
  if (!frame) frame = requestAnimationFrame(() => { frame = 0; drawPoints(); });
}

// Everything drawn under the pointer, topmost first.
function hitsAt(event) {
  const domEvent = event.domEvent || {};
  const point = domEvent.changedTouches ? domEvent.changedTouches[0] : domEvent;
  let x, y;
  if (Number.isFinite(point.clientX)) {
    const rect = map.getDiv().getBoundingClientRect();
    x = point.clientX - rect.left;
    y = point.clientY - rect.top;
  } else {
    const pixel = overlay.getProjection().fromLatLngToContainerPixel(event.latLng);
    x = pixel.x;
    y = pixel.y;
  }
  const hits = [];
  for (let i = drawn.length - 1; i >= 0; i--) {
    const { item, x: cx, y: cy } = drawn[i];
    const r = item.r + 2;
    if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r) hits.push(item);
  }
  return hits;
}

function openPopup(hotels, lat, lon, offset) {
  const html = hotels.length === 1 ? popupHtml(hotels[0])
    : `<div class="hp-list">${hotels.slice(0, 25).map(popupHtml).join("")}</div>`;
  infoWindow.setOptions({ content: html, position: { lat, lng: lon }, pixelOffset: new google.maps.Size(0, -offset) });
  infoWindow.open({ map });
}

function onMapClick(event) {
  const hits = hitsAt(event);
  if (!hits.length) return;
  if (event.stop) event.stop();  // don't also open a Google POI popup
  const top = hits[0];
  if (top.clusterId !== null) {
    const index = indexes[top.program];
    const expansionZoom = index.getClusterExpansionZoom(top.clusterId);
    if (expansionZoom > CLUSTER_MAX_ZOOM) {
      // Hotels this close never split apart: list them instead of zooming forever.
      openPopup(index.getLeaves(top.clusterId, 25).map(leaf => leaf.properties.hotel), top.lat, top.lon, top.r);
    } else {
      map.setZoom(expansionZoom);
      map.panTo({ lat: top.lat, lng: top.lon });
    }
    return;
  }
  // Several programs can list the same property at the same spot: show all of them.
  const singles = hits.filter(item => item.clusterId === null);
  openPopup(singles.map(item => item.hotel), top.lat, top.lon, top.r);
}

function onMapMouseMove(event) {
  const top = hitsAt(event)[0];
  if (!!top !== cursorIsPointer) {
    cursorIsPointer = !!top;
    map.setOptions({ draggableCursor: top ? "pointer" : null });
  }
  if (!top) { tip.style.display = "none"; return; }
  tip.textContent = top.count === 1 ? top.hotel.n : `${top.count.toLocaleString()} hotels · click to zoom`;
  tip.style.left = `${event.domEvent.clientX + 14}px`;
  tip.style.top = `${event.domEvent.clientY + 14}px`;
  tip.style.display = "block";
}

async function initMap() {
  // Called via the Maps &callback= param, once importLibrary is ready; load the classes we use.
  const [{ Map, RenderingType, InfoWindow, OverlayView }] = await Promise.all([
    google.maps.importLibrary("maps"),
    google.maps.importLibrary("core"),
  ]);
  map = new Map(document.getElementById("map"), {
    center: { lat: 20, lng: 10 }, zoom: 2, minZoom: 2, mapTypeControl: false,
    streetViewControl: false, fullscreenControl: true,
    renderingType: RenderingType.RASTER,
  });
  infoWindow = new InfoWindow();

  class CanvasOverlay extends OverlayView {
    onAdd() {
      this.canvas = document.createElement("canvas");
      this.canvas.style.position = "absolute";
      this.canvas.style.pointerEvents = "none";
      this.getPanes().overlayLayer.appendChild(this.canvas);
    }
    draw() { drawPoints(); }
    onRemove() { this.canvas.remove(); this.canvas = null; }
  }
  overlay = new CanvasOverlay();
  overlay.setMap(map);
  map.addListener("bounds_changed", scheduleDraw);
  map.addListener("click", onMapClick);
  map.addListener("mousemove", onMapMouseMove);
  map.addListener("mouseout", () => { tip.style.display = "none"; });
  map.addListener("dragstart", () => { tip.style.display = "none"; });

  fetch("hotels.json")
    .then(response => { if (!response.ok) throw new Error(response.status); return response.json(); })
    .then(data => { allHotels = data; buildIndexes(data); })
    .catch(error => { tally.textContent = "Failed to load data"; console.error("Could not load hotels.json:", error); });
}

function loadGoogleMaps() {
  const key = window.MAP_CONFIG && window.MAP_CONFIG.googleMapsApiKey;
  if (!key) { tally.textContent = "Google Maps key required"; console.error("Set googleMapsApiKey in docs/map-config.js before publishing."); return; }
  const script = document.createElement("script");
  script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&v=weekly&loading=async&callback=onGoogleMapsReady`;
  script.async = true;
  window.onGoogleMapsReady = () => initMap().catch(error => { tally.textContent = "Failed to load Google Maps"; console.error(error); });
  script.onerror = () => { tally.textContent = "Failed to load Google Maps"; };
  document.head.appendChild(script);
}

document.querySelectorAll(".leg").forEach(element => {
  element.addEventListener("click", () => {
    const program = element.dataset.key;
    enabled[program] = !enabled[program];
    element.classList.toggle("off", !enabled[program]);
    drawPoints();
    updateTally();
  });
});

let searchTimer;
document.getElementById("search").addEventListener("input", event => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const query = event.target.value.trim().toLowerCase();
    buildIndexes(query ? allHotels.filter(hotel => hotel.n.toLowerCase().includes(query) ||
      (hotel.a && hotel.a.toLowerCase().includes(query)) || (hotel.b && hotel.b.toLowerCase().includes(query)) ||
      (hotel.g && hotel.g.toLowerCase().includes(query))) : allHotels);
  }, 220);
});

loadGoogleMaps();
</script>
</body>
</html>
