name: Update FHR and THC Hotels Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scrape-geocode-fhrthc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      any_changed: ${{ steps.check_list.outputs.any_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tenacity python-dotenv gspread google-auth

      - name: Ensure cache directory exists
        run: mkdir -p cache

      - name: Run FHR/THC scraper
        run: |
          python fhrthc.py | tee fhrthc.log

      - name: Did FHR or THC list change vs geocode cache?
        id: check_list
        run: |
          fhr_changed="false"
          thc_changed="false"
          any_changed="false"

          if [ ! -s cache/geocode_cache_google_fhr.json ] || [ ! -s cache/geocode_cache_google_thc.json ]; then
            echo "No cache index built (file missing or empty: cache/geocode_cache_google_fhr.json or cache/geocode_cache_google_thc.json)." | tee -a fhrthc.log
            fhr_changed="true"
            thc_changed="true"
            any_changed="true"
          elif grep -q "FHR/THC hotels NOT found in geocode cache (new hotels):" fhrthc.log || \
               grep -q "FHR/THC hotels in geocode cache but NOT in current scraped list (removed):" fhrthc.log || \
               grep -q "FHR/THC hotels with possible name changes" fhrthc.log; then
            any_changed="true"
            if grep -q "\[program: FHR\]" fhrthc.log; then
              fhr_changed="true"
            fi
            if grep -q "\[program: THC\]" fhrthc.log; then
              thc_changed="true"
            fi
            # If change was detected but per-program tags are missing/unknown,
            # treat both programs as changed to avoid skipping required updates.
            if [ "$fhr_changed" = "false" ] && [ "$thc_changed" = "false" ]; then
              fhr_changed="true"
              thc_changed="true"
            fi
          fi

          if [ "$fhr_changed" = "true" ] || [ "$thc_changed" = "true" ]; then
            any_changed="true"
          fi

          echo "fhr_changed=${fhr_changed}" >> "$GITHUB_OUTPUT"
          echo "thc_changed=${thc_changed}" >> "$GITHUB_OUTPUT"
          echo "any_changed=${any_changed}" >> "$GITHUB_OUTPUT"

      # Geocoding always runs. It makes no API calls when every hotel is cached
      # and location-compatible, so it is effectively free, and it is the only
      # thing that can repair a cache entry whose coordinates are wrong. Gating
      # it on "the hotel list changed" meant a wrong coordinate could never be
      # corrected unless AMEX happened to add or drop a hotel that night.
      # Notifications are gated separately, on whether output actually changed.
      - name: Run Google geocoding (FHR)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python google-convert.py \
            --input cache/fhr_hotels.csv \
            --output cache/fhr_hotels_geocoded_google.csv \
            --cache cache/geocode_cache_google_fhr.json \
            --input-format fhrthc | tee -a fhrthc.log

      - name: Run Google geocoding (THC)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python google-convert.py \
            --input cache/thc_hotels.csv \
            --output cache/thc_hotels_geocoded_google.csv \
            --cache cache/geocode_cache_google_thc.json \
            --input-format fhrthc | tee -a fhrthc.log

      - name: Did the geocoded output actually change?
        id: check_output
        env:
          LIST_CHANGED: ${{ steps.check_list.outputs.any_changed }}
        run: |
          # A notification should mean "the hotel data changed", so compare the
          # geocoded CSVs rather than the cache files - the caches also carry
          # bookkeeping (e.g. a refreshed location-mismatch timestamp) that
          # changes without the data changing.
          #
          # The status column is excluded: it records how a row was obtained
          # this run, not what the row says. It necessarily flips from
          # "PLACES:<query>" to "CACHED" on the run after any geocode, which
          # would otherwise mail out a diff whose coordinates are identical.
          python - <<'PY'
          import csv, io, os, subprocess

          IGNORED = {"status"}

          def rows(text):
              return [
                  {k: v for k, v in row.items() if k not in IGNORED}
                  for row in csv.DictReader(io.StringIO(text))
              ]

          def committed(path):
              r = subprocess.run(["git", "show", f"HEAD:{path}"],
                                 capture_output=True, text=True)
              return r.stdout if r.returncode == 0 else ""

          def current(path):
              if not os.path.exists(path):
                  return ""
              with open(path, encoding="utf-8") as fh:
                  return fh.read()

          results = {}
          for key, path in [("fhr_out", "cache/fhr_hotels_geocoded_google.csv"),
                            ("thc_out", "cache/thc_hotels_geocoded_google.csv")]:
              results[key] = "true" if rows(committed(path)) != rows(current(path)) else "false"

          notify = (
              "true"
              if "true" in results.values() or os.environ.get("LIST_CHANGED") == "true"
              else "false"
          )
          results["notify"] = notify

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for key, value in results.items():
                  fh.write(f"{key}={value}\n")
          print(f"meaningful change (status column ignored): {results}")
          PY

      - name: Write Google service account credentials
        if: steps.check_output.outputs.notify == 'true'
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > service_account.json

      - name: Update Google Sheet with geocoded FHR CSV
        if: steps.check_output.outputs.fhr_out == 'true'
        continue-on-error: true
        env:
          FHR_SHEET_ID: ${{ vars.FHR_SHEET_ID || secrets.FHR_SHEET_ID }}
        run: |
          python - << 'PY'
          import os
          import pandas as pd
          import gspread
          from google.oauth2.service_account import Credentials
          from gspread.exceptions import SpreadsheetNotFound

          SHEET_ID = os.getenv("FHR_SHEET_ID", "").strip()
          CSV_PATH = "cache/fhr_hotels_geocoded_google.csv"
          if not SHEET_ID:
            raise SystemExit("Missing FHR_SHEET_ID (set vars.FHR_SHEET_ID or secrets.FHR_SHEET_ID)")

          df = pd.read_csv(CSV_PATH)
          scopes = ["https://www.googleapis.com/auth/spreadsheets"]
          creds = Credentials.from_service_account_file("service_account.json", scopes=scopes)
          client = gspread.authorize(creds)
          print(f"Using service account: {creds.service_account_email}")
          print(f"Target sheet id prefix: {SHEET_ID[:6]}... (len={len(SHEET_ID)})")

          try:
            sh = client.open_by_key(SHEET_ID)
          except SpreadsheetNotFound as ex:
            raise SystemExit(
              "Spreadsheet not found for this service account. "
              "Share the target sheet with the service account email above."
            ) from ex
          ws = sh.sheet1
          ws.clear()
          rows = [df.columns.tolist()] + df.astype(object).where(df.notnull(), "").values.tolist()
          ws.update(rows)
          PY

      - name: Update Google Sheet with geocoded THC CSV
        if: steps.check_output.outputs.thc_out == 'true'
        continue-on-error: true
        env:
          THC_SHEET_ID: ${{ vars.THC_SHEET_ID || secrets.THC_SHEET_ID }}
        run: |
          python - << 'PY'
          import os
          import pandas as pd
          import gspread
          from google.oauth2.service_account import Credentials
          from gspread.exceptions import SpreadsheetNotFound

          SHEET_ID = os.getenv("THC_SHEET_ID", "").strip()
          CSV_PATH = "cache/thc_hotels_geocoded_google.csv"
          if not SHEET_ID:
            raise SystemExit("Missing THC_SHEET_ID (set vars.THC_SHEET_ID or secrets.THC_SHEET_ID)")

          df = pd.read_csv(CSV_PATH)
          scopes = ["https://www.googleapis.com/auth/spreadsheets"]
          creds = Credentials.from_service_account_file("service_account.json", scopes=scopes)
          client = gspread.authorize(creds)
          print(f"Using service account: {creds.service_account_email}")
          print(f"Target sheet id prefix: {SHEET_ID[:6]}... (len={len(SHEET_ID)})")

          try:
            sh = client.open_by_key(SHEET_ID)
          except SpreadsheetNotFound as ex:
            raise SystemExit(
              "Spreadsheet not found for this service account. "
              "Share the target sheet with the service account email above."
            ) from ex
          ws = sh.sheet1
          ws.clear()
          rows = [df.columns.tolist()] + df.astype(object).where(df.notnull(), "").values.tolist()
          ws.update(rows)
          PY

      - name: Send email with updated geocoded FHR/THC CSVs
        if: steps.check_output.outputs.notify == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ vars.SMTP_SERVER }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "FHR/THC hotel lists updated"
          to: ${{ vars.EMAIL_TO }}
          from: ${{ vars.EMAIL_FROM }}
          body: file://fhrthc.log
          attachments: |
            cache/fhr_hotels_geocoded_google.csv
            cache/thc_hotels_geocoded_google.csv

      # Always attempt the commit: cache bookkeeping (e.g. a refreshed
      # location-mismatch timestamp) should still be persisted even when it is
      # not worth an email. The porcelain check below makes this a no-op when
      # there is genuinely nothing to write.
      - name: Commit and push cache and map updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            cache/fhr_hotels_geocoded_google.csv \
            cache/thc_hotels_geocoded_google.csv \
            cache/geocode_cache_google_fhr.json \
            cache/geocode_cache_google_thc.json || true

          python generate_map_data.py
          git add docs/hotels.json

          # Test the index, not the working tree: git status --porcelain also
          # reports untracked files (the scraper log, service_account.json),
          # which would make this look dirty on a no-change run and then fail
          # on an empty commit.
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "Update FHR/THC cache, geocoded hotels, and map [CI]"
            git push
          fi
