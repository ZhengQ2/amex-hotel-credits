name: Update Hilton Resort List Nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  scrape-geocode-update-sheet:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.check_list.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas requests tenacity python-dotenv gspread google-auth
          python -m playwright install --with-deps chromium

      - name: Ensure cache directory exists
        run: mkdir -p cache

      - name: Run Hilton scraper
        run: |
          python hilton.py | tee hilton.log

      - name: Did Hilton list change vs geocode cache?
        id: check_list
        run: |
          if [ ! -s cache/geocode_cache_google_hilton.json ]; then
            echo "No cache index built (file missing or empty: cache/geocode_cache_google_hilton.json)." | tee -a hilton.log
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif grep -q "Hotels NOT found in geocode cache (new hotels):" hilton.log || \
             grep -q "Hotels in geocode cache but NOT in current scraped list (removed):" hilton.log || \
             grep -q "Hotels with possible name changes" hilton.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Always run: no API calls when everything is cached and
      # location-compatible, and it is the only thing that can repair a cache
      # entry whose coordinates are wrong. Notifications gate separately below.
      - name: Run Google geocoding (Hilton)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python google-convert.py \
            --input cache/hilton_hotels.csv \
            --output cache/hilton_hotels_geocoded_google.csv \
            --cache cache/geocode_cache_google_hilton.json \
            --input-format hilton | tee -a hilton.log

      - name: Did the geocoded output actually change?
        id: check_output
        run: |
          # Compare the geocoded CSV (names + coordinates), not the cache, which
          # also carries bookkeeping that changes without the data changing.
          notify="false"
          if ! git diff --quiet -- cache/hilton_hotels_geocoded_google.csv; then
            notify="true"
          fi
          if [ "${{ steps.check_list.outputs.changed }}" = "true" ]; then
            notify="true"
          fi
          echo "notify=${notify}" >> "$GITHUB_OUTPUT"
          echo "geocoded output changed -> notify=${notify}"

      - name: Write Google service account credentials
        if: steps.check_output.outputs.notify == 'true'
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > service_account.json

      - name: Update Google Sheet with geocoded Hilton CSV
        if: steps.check_output.outputs.notify == 'true'
        continue-on-error: true
        env:
          HILTON_SHEET_ID: ${{ vars.HILTON_SHEET_ID || secrets.HILTON_SHEET_ID }}
        run: |
          python - << 'PY'
          import os
          import pandas as pd
          import gspread
          from google.oauth2.service_account import Credentials
          from gspread.exceptions import SpreadsheetNotFound

          SHEET_ID = os.getenv("HILTON_SHEET_ID", "").strip()
          CSV_PATH = "cache/hilton_hotels_geocoded_google.csv"
          if not SHEET_ID:
            raise SystemExit("Missing HILTON_SHEET_ID (set vars.HILTON_SHEET_ID or secrets.HILTON_SHEET_ID)")

          df = pd.read_csv(CSV_PATH)
          scopes = ["https://www.googleapis.com/auth/spreadsheets"]
          creds = Credentials.from_service_account_file("service_account.json", scopes=scopes)
          client = gspread.authorize(creds)
          print(f"Using service account: {creds.service_account_email}")
          print(f"Target sheet id prefix: {SHEET_ID[:6]}... (len={len(SHEET_ID)})")

          try:
            sh = client.open_by_key(SHEET_ID)
          except SpreadsheetNotFound as ex:
            raise SystemExit(
              "Spreadsheet not found for this service account. "
              "Share the target sheet with the service account email above."
            ) from ex
          ws = sh.sheet1
          ws.clear()
          rows = [df.columns.tolist()] + df.astype(object).where(df.notnull(), "").values.tolist()
          ws.update(rows)
          PY

      - name: Send email with updated geocoded Hilton CSV
        if: steps.check_output.outputs.notify == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ vars.SMTP_SERVER }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Hilton resort-credit hotel list updated"
          to: ${{ vars.EMAIL_TO }}
          from: ${{ vars.EMAIL_FROM }}
          body: file://hilton.log
          attachments: |
            cache/hilton_hotels_geocoded_google.csv

      - name: Commit and push cache and map updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add cache/geocode_cache_google_hilton.json cache/hilton_hotels_geocoded_google.csv || true

          python generate_map_data.py
          git add docs/hotels.json

          # Test the index, not the working tree: --porcelain also reports
          # untracked files (log, service_account.json) and would then fail on
          # an empty commit.
          if ! git diff --cached --quiet; then
            git commit -m "Update Hilton cache, geocoded hotels, and map [CI]"
            git push
          else
            echo "No cache changes to commit."
          fi
