name: Update FHR and THC Hotels

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scrape-geocode-fhrthc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tenacity python-dotenv gspread google-auth

      - name: Ensure cache directory exists
        run: mkdir -p cache

      - name: Run FHR/THC scraper
        run: |
          python fhrthc.py | tee fhrthc.log

      - name: Did FHR or THC list change vs geocode cache?
        id: check_list
        run: |
          python - << 'PY'
          import csv
          from pathlib import Path

          SOURCES = {
              "fhr": {
                  "scraped": Path("cache/fhr_hotels.csv"),
                  "geocoded": Path("cache/fhr_hotels_geocoded_google.csv"),
                  "flag": Path("/tmp/fhr_changed"),
              },
              "thc": {
                  "scraped": Path("cache/thc_hotels.csv"),
                  "geocoded": Path("cache/thc_hotels_geocoded_google.csv"),
                  "flag": Path("/tmp/thc_changed"),
              },
          }

          def row_key(row):
              return (
                  (row.get("program_label") or "").strip().lower(),
                  (row.get("brand_label") or "").strip().lower(),
                  (row.get("hotel_location") or "").strip().lower(),
                  (row.get("hotel_name") or "").strip().lower(),
              )

          for name, paths in SOURCES.items():
              scraped_path = paths["scraped"]
              geocoded_path = paths["geocoded"]
              flag_path = paths["flag"]

              if not geocoded_path.exists():
                  print(f"[{name}] No previous geocoded CSV found; treating as changed.")
                  flag_path.write_text("true", encoding="utf-8")
                  continue

              scraped_rows = set()
              with scraped_path.open(newline="", encoding="utf-8") as f:
                  for row in csv.DictReader(f):
                      scraped_rows.add(row_key(row))

              geocoded_rows = set()
              with geocoded_path.open(newline="", encoding="utf-8") as f:
                  for row in csv.DictReader(f):
                      geocoded_rows.add(row_key(row))

              added = sorted(scraped_rows - geocoded_rows)
              removed = sorted(geocoded_rows - scraped_rows)

              if added:
                  print(f"[{name}] Hotels NOT found in geocode cache (new hotels):")
                  for p, b, l, h in added[:30]:
                      print(f"- {h} [program: {p}] [brand: {b}] [location: {l}]")
                  if len(added) > 30:
                      print(f"... and {len(added) - 30} more")

              if removed:
                  print(f"[{name}] Hotels in geocode cache but NOT in current scraped list (removed):")
                  for p, b, l, h in removed[:30]:
                      print(f"- {h} [program: {p}] [brand: {b}] [location: {l}]")
                  if len(removed) > 30:
                      print(f"... and {len(removed) - 30} more")

              flag_path.write_text("true" if (added or removed) else "false", encoding="utf-8")
          PY

          fhr_changed="$(cat /tmp/fhr_changed)"
          thc_changed="$(cat /tmp/thc_changed)"
          any_changed="false"
          if [ "$fhr_changed" = "true" ] || [ "$thc_changed" = "true" ]; then
            any_changed="true"
          fi
          echo "fhr_changed=${fhr_changed}" >> "$GITHUB_OUTPUT"
          echo "thc_changed=${thc_changed}" >> "$GITHUB_OUTPUT"
          echo "any_changed=${any_changed}" >> "$GITHUB_OUTPUT"

      - name: Run Google geocoding (FHR)
        if: steps.check_list.outputs.fhr_changed == 'true'
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python google-convert.py \
            --input cache/fhr_hotels.csv \
            --output cache/fhr_hotels_geocoded_google.csv \
            --cache cache/geocode_cache_google_fhr.json \
            --input-format fhrthc | tee -a fhrthc.log

      - name: Run Google geocoding (THC)
        if: steps.check_list.outputs.thc_changed == 'true'
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python google-convert.py \
            --input cache/thc_hotels.csv \
            --output cache/thc_hotels_geocoded_google.csv \
            --cache cache/geocode_cache_google_thc.json \
            --input-format fhrthc | tee -a fhrthc.log

      - name: Write Google service account credentials
        if: steps.check_list.outputs.any_changed == 'true'
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > service_account.json

      - name: Update Google Sheet with geocoded FHR CSV
        if: steps.check_list.outputs.fhr_changed == 'true'
        env:
          FHR_SHEET_ID: ${{ vars.FHR_SHEET_ID || secrets.FHR_SHEET_ID }}
        run: |
          python - << 'PY'
          import os
          import pandas as pd
          import gspread
          from google.oauth2.service_account import Credentials
          from gspread.exceptions import SpreadsheetNotFound

          SHEET_ID = os.getenv("FHR_SHEET_ID", "").strip()
          CSV_PATH = "cache/fhr_hotels_geocoded_google.csv"
          if not SHEET_ID:
            raise SystemExit("Missing FHR_SHEET_ID (set vars.FHR_SHEET_ID or secrets.FHR_SHEET_ID)")

          df = pd.read_csv(CSV_PATH)
          scopes = ["https://www.googleapis.com/auth/spreadsheets"]
          creds = Credentials.from_service_account_file("service_account.json", scopes=scopes)
          client = gspread.authorize(creds)
          print(f"Using service account: {creds.service_account_email}")
          print(f"Target sheet id prefix: {SHEET_ID[:6]}... (len={len(SHEET_ID)})")

          try:
            sh = client.open_by_key(SHEET_ID)
          except SpreadsheetNotFound as ex:
            raise SystemExit(
              "Spreadsheet not found for this service account. "
              "Share the target sheet with the service account email above."
            ) from ex
          ws = sh.sheet1
          ws.clear()
          rows = [df.columns.tolist()] + df.astype(object).where(df.notnull(), "").values.tolist()
          ws.update(rows)
          PY

      - name: Update Google Sheet with geocoded THC CSV
        if: steps.check_list.outputs.thc_changed == 'true'
        env:
          THC_SHEET_ID: ${{ vars.THC_SHEET_ID || secrets.THC_SHEET_ID }}
        run: |
          python - << 'PY'
          import os
          import pandas as pd
          import gspread
          from google.oauth2.service_account import Credentials
          from gspread.exceptions import SpreadsheetNotFound

          SHEET_ID = os.getenv("THC_SHEET_ID", "").strip()
          CSV_PATH = "cache/thc_hotels_geocoded_google.csv"
          if not SHEET_ID:
            raise SystemExit("Missing THC_SHEET_ID (set vars.THC_SHEET_ID or secrets.THC_SHEET_ID)")

          df = pd.read_csv(CSV_PATH)
          scopes = ["https://www.googleapis.com/auth/spreadsheets"]
          creds = Credentials.from_service_account_file("service_account.json", scopes=scopes)
          client = gspread.authorize(creds)
          print(f"Using service account: {creds.service_account_email}")
          print(f"Target sheet id prefix: {SHEET_ID[:6]}... (len={len(SHEET_ID)})")

          try:
            sh = client.open_by_key(SHEET_ID)
          except SpreadsheetNotFound as ex:
            raise SystemExit(
              "Spreadsheet not found for this service account. "
              "Share the target sheet with the service account email above."
            ) from ex
          ws = sh.sheet1
          ws.clear()
          rows = [df.columns.tolist()] + df.astype(object).where(df.notnull(), "").values.tolist()
          ws.update(rows)
          PY

      - name: Send email with updated geocoded FHR/THC CSVs
        if: steps.check_list.outputs.any_changed == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ vars.SMTP_SERVER }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "FHR/THC hotel lists updated"
          to: ${{ vars.EMAIL_TO }}
          from: ${{ vars.EMAIL_FROM }}
          body: file://fhrthc.log
          attachments: |
            cache/fhr_hotels_geocoded_google.csv
            cache/thc_hotels_geocoded_google.csv

      - name: Commit and push cache updates
        if: steps.check_list.outputs.any_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            cache/fhr_hotels.csv \
            cache/thc_hotels.csv \
            cache/fhr_hotels_geocoded_google.csv \
            cache/thc_hotels_geocoded_google.csv \
            cache/geocode_cache_google_fhr.json \
            cache/geocode_cache_google_thc.json || true

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update FHR/THC cache and geocoded hotels [CI]"
            git push
          else
            echo "No cache changes to commit."
          fi
