name: Update Map Data

on:
  workflow_call:
  workflow_dispatch:

jobs:
  update-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate docs/hotels.json
        run: python generate_map_data.py

      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/hotels.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update map data [CI]"
            git push
          else
            echo "No map data changes."
          fi
